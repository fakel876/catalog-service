# docker-compose.yml
# Локальное окружение для разработки
#
# Запуск:    docker compose up -d
# Остановка: docker compose down
# Логи:      docker compose logs -f

services:
  # ---------------------------------------------------------------------------- #
  # PostgreSQL
  # ---------------------------------------------------------------------------- #
  postgres:
    container_name: "catalog_postgres"
    image: "postgres:16-alpine"
    restart: "unless-stopped"
    ports:
      - "5429:5432"
    environment:
      POSTGRES_USER: "catalog_user"
      POSTGRES_PASSWORD: "catalog_pass"
      POSTGRES_DB: "catalog_db"
    volumes:
      - "mom_bp_postgres_data:/var/lib/postgresql/data"
    networks:
      - "mom_bp_net"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------------- #
# Volumes
# ---------------------------------------------------------------------------- #
volumes:
  mom_bp_postgres_data: {}

# ---------------------------------------------------------------------------- #
# Networks
# ---------------------------------------------------------------------------- #
networks:
  mom_bp_net: {}
